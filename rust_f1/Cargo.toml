[package]
name = "f1_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "f1_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["numpy"] }
numpy = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
